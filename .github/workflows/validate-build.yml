name: Validate HSdeck unified Witchwood card history
on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'cards.json'
      - '.github/workflows/validate-build.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hsdeck-witchwood-dates-v1
  cancel-in-progress: false
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read immutable migration converter
        run: |
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/qxwd565/legacy/c7622bd48972ff3b79f095533e6bdb4ffcc01cf0/tools/flatten-date-sources.py' -o /tmp/flatten-dates-v1.py
      - name: Convert and verify 156 card histories
        run: |
          python /tmp/flatten-dates-v1.py --root . --strict
          python /tmp/flatten-dates-v1.py --root . --strict --check
          git diff --check
      - name: Verify first-playable day against all 156 dated card documents
        run: |
          python - <<'PYRELEASE'
          import json
          from pathlib import Path
          p=Path("cards.json")
          payload=json.loads(p.read_text(encoding="utf-8"))
          if len(payload.get("cards", []))!=156: raise SystemExit("Unexpected catalog size")
          for card in payload["cards"]:
              path=Path("data")/(card["id"]+".json")
              doc=json.loads(path.read_text(encoding="utf-8"))
              dates=sorted(k for k in doc if len(k)==10 and k[4]=="-" and k[7]=="-")
              if not dates: raise SystemExit("Missing dated source: "+card["id"])
              first=doc[dates[0]]
              if first.get("id")!=card["id"] or first.get("dbfId")!=card["dbfId"]: raise SystemExit("Card identity mismatch "+card["id"])
              if dates[0]!="2018-04-13": raise SystemExit("Unexpected first-playable day "+card["id"]+" "+dates[0])
              if card.get("releasedAt") not in (None,dates[0]): raise SystemExit("Contradictory date "+card["id"])
              card["releasedAt"]=dates[0]
              card["releaseStatus"]="verified"
          p.write_text(json.dumps(payload,ensure_ascii=False,separators=(",",":"))+"\n",encoding="utf-8")
          PYRELEASE
      - name: Commit only dates-v1 card documents
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- data/ cards.json
          if ! git diff --cached --quiet; then
            git commit -m 'Unify Witchwood card history as public dates-v1 [skip ci]'
            git push origin HEAD:main
          fi
